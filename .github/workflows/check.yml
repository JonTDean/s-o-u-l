name: Source checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUST_MIN_STACK: 67108864
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CMAKE_POLICY_VERSION_MINIMUM: 3.5
      XDG_RUNTIME_DIR: /tmp/soul-runtime
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-soul-rust1941-debug0-${{ hashFiles('**/Cargo.lock') }}
      - name: Install native dependencies and source tokenizer
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libvulkan1 mesa-vulkan-drivers cmake ninja-build
          python3 -m pip install -r tools/structure/requirements.txt
          mkdir -m 700 "$XDG_RUNTIME_DIR"
      - run: make check
